<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161b19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Atril">
  <title>Atril</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- barra superior: ☰ ajustes · título · + nuevo -->
  <header class="appbar" id="navbar">
    <button class="ab-btn" id="abLeft" aria-label="Abrir ajustes"></button>
    <h1 class="ab-title" id="abTitle">Guiones</h1>
    <span class="sync-dot" id="syncDot" title="Sincronización"></span>
    <button class="ab-btn" id="abRight" aria-label="Nuevo guion" hidden></button>
  </header>

  <!-- panel lateral de ajustes -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Ajustes" aria-hidden="true"></aside>

  <main id="view" class="view"></main>

  <!-- Teleprompter -->
  <section id="prompter" class="prompter" hidden aria-label="Teleprompter">
    <div class="p-bg" id="pBg" hidden></div>
    <div class="p-scroll" id="pScroll"><div class="p-text" id="pText"></div></div>
    <div class="p-guide"></div>
    <div class="p-progress"><div id="pProgress"></div></div>
    <div class="p-count" id="pCount" hidden></div>
    <div class="p-top">
      <button class="p-btn glass" data-act="exit" aria-label="Salir"></button>
      <span class="p-title" id="pTitle"></span>
      <button class="p-btn glass" data-act="remote" id="pRemote" aria-label="Conectar control remoto"></button>
      <button class="p-btn glass" data-act="top" aria-label="Volver al inicio"></button>
    </div>
    <div class="p-dock" id="pDock">
      <button class="p-btn" data-act="smaller" aria-label="Letra más chica"></button>
      <span class="p-val" id="pFont"></span>
      <button class="p-btn" data-act="bigger" aria-label="Letra más grande"></button>
      <span class="p-div"></span>
      <button class="p-btn" data-act="prev" aria-label="Canción anterior"></button>
      <button class="p-btn big" data-act="play" id="pPlay" aria-label="Reproducir o pausar"></button>
      <button class="p-btn" data-act="next" aria-label="Siguiente canción"></button>
      <span class="p-div"></span>
      <button class="p-btn" data-act="slower" aria-label="Más lento"></button>
      <input type="range" class="p-range" id="pSpeedR" min="0.5" max="30" step="0.5" aria-label="Velocidad">
      <button class="p-val p-speed" data-act="speeds" id="pSpeed" aria-label="Elegir velocidad"></button>
      <button class="p-btn" data-act="faster" aria-label="Más rápido"></button>
      <span class="p-div"></span>
      <button class="p-btn" data-act="mirror" id="pMirror" aria-label="Modo espejo"></button>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <dialog class="sheet" id="sheet"></dialog>
  <dialog class="sheet" id="sheet2"></dialog>

  <script src="config.js"></script>
  <!-- tus datos locales (solo en tu PC; en GitHub no existe y se ignora) -->
  <script src="data/mis-datos.js" onerror="this.remove()"></script>
  <script src="data/datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
